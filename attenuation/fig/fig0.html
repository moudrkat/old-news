<figcaption>
<b>How to read a row.</b> The sentence carrying the fact is in the conversation
in every column — including the last two. Only the weight the model gives it
changes. <b>b is different for every item, and the two models are not on the same
scale:</b> each dose is the lowest at which <i>that model's</i> answer no longer
contains the value, so rows are not comparable to one another and are not meant
to be — which is why the model is printed under every dose. The final column is what the
same model answered, separately, to “did I tell you this? answer only yes or
no”.<br><br>
12 of these 14 say <b>yes</b>, 10 of them while giving a
wrong value. Every answer is printed in full. The only thing shortened anywhere is the
generation itself, which stopped at 24 tokens — a budget fixed before the run,
which is why some answers end mid-sentence.<br><br>
<b>These are not the best examples in the data — they are a draw.</b> The
corpus contains rows that make the point far more sharply, all of them on
Qwen3.5-4B: <code>LH772&nbsp;→&nbsp;LH400</code>, <code>BA945&nbsp;→&nbsp;BA118</code>,
<code>SK651&nbsp;→&nbsp;SK555</code> — the airline code survives and the digits
are replaced by a number that looks like one that airline would use;
<code>19:40&nbsp;→&nbsp;19:45</code>, <code>22:41&nbsp;→&nbsp;22:45</code>,
<code>17:49&nbsp;→&nbsp;17:45</code> — five minutes out; and
<code>Utrecht&nbsp;→&nbsp;Amsterdam</code>, <code>Graz&nbsp;→&nbsp;Linz</code>,
which keep the country and even the sentence <i>"the second-largest city"</i>.
Those are quoted in the text, and they are quoted <i>as</i> chosen. This figure
is the unchosen version, and the seed is printed so the same draw can be
reproduced.

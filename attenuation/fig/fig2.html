<h2>The value does not flip. It comes apart — at a different dose for every item,
and on a different scale for every model.</h2>
<p class="sub">columns are <b>b</b>, the strength of the bias on that sentence's
attention · in each cell, what the model actually answered, and above it the
longest run of characters that answer still shares with the true value ·
one item of each kind, the first value of each, not a selection &middot; the
last column is that item at <b>its own</b> threshold, from the run whose ladder
reaches 14</p>
<p class="lead"><b>The claim, over every item.</b> Both models saw the same 100
items. The dose at which a value disappears is twice as high on one as on the
other, and the ranges barely overlap:</p>
<table class="stat"><tr><th></th><th>items</th><th>still had the value<br>at b = 14</th><th>median b at which the value goes</th><th>range of the rest</th></tr><tr><th>Qwen3.5-4B</th><td>100</td><td>11</td><td><b>6</b></td><td>3 – 14, plus 11 above 14</td></tr><tr><th>Qwen3-4B-Instruct-2507</th><td>100</td><td>—</td><td><b>3</b></td><td>2 – 5</td></tr></table>
<p class="foot">Qwen3.5 still had 11 of its values at b&nbsp;=&nbsp;14, the top of
the sweep, so those 11 have a lower bound and no threshold. They are counted in
the median rather than dropped — dropping them would have removed the eleven
<i>most</i> resistant items from the more resistant model and made the gap look
smaller than it is. With all 11 sorted above every measured value the median over
all 100 is still exact, because the 50th and 51st items fall inside the 89 that
were measured. Extending the sweep past 14 would sharpen the range; it cannot
move the median.</p>

<p class="foot"><b>One confound, and it is not small.</b> The bias only reaches
layers that run full attention. On Qwen3-4B that is all 36 of them; on
Qwen3.5-4B, a hybrid with three linear-attention layers for every full one, it
is 8 of 32. So the model that needs twice the dose is also the model where three
quarters of the layers never see the bias — and nothing in this report separates
those two explanations.</p>

<p class="lead"><b>Examples, to show what that looks like.</b> One item of each
kind, the first value of each — a rule fixed in the code, not a selection.
There are prettier rows in the data: items that pass through every stage in
turn, correct → truncated → substituted → refused. These are not those.</p>

<figcaption>
Nothing is deleted at any column — the sentence is in the conversation
throughout, only harder to read. <b>The grids are examples, not the evidence.</b> The scale claim rests on the
table at the top — 100 items each, median 3 against median 6. The ten rows below are
one item of each kind by a fixed rule, and both models are shown rather than one,
so nothing is being chosen for looking better.
The last category — <i>declines to answer</i> — is the one soft judgement here,
a keyword match on the opening of the answer; everything else is exact string
matching.
<br><br>
<b>Every answer is shown whole.</b> Nothing in a cell is shortened for display,
so the hedges, the self-corrections and the invented explanations are all here
to be read rather than summarised into a colour. The one cut is the generation
budget — 20 tokens in the grid, 24 in the threshold column — which is why some
answers stop mid-sentence; it was fixed before the run, not chosen afterwards.
<br><br>
<b>The last column exists because a green row is ambiguous.</b> The sweep
stops at b&nbsp;=&nbsp;10, so a row still holding its value at the right edge
could mean the value survives or could mean the figure stopped too early.
<code>Brno</code> on Qwen3.5 is the second kind: it holds at every dose on this
ladder, and it is one of the eleven items that still had their value at
b&nbsp;=&nbsp;14 — so no threshold was found for it, which is what the cell says
rather than leaving an unbroken green row for the reader to interpret. Not the
same as never losing it: a pilot run over a finer sweep caught this item
answering <i>"You live in <b>Prague</b>"</i> at b&nbsp;=&nbsp;11, a dose this
ladder does not test, and then it is back to <code>Brno</code> at 14. The value
returns, so every number here is a first crossing and not a point of no return.
On the other model the same item goes at b&nbsp;=&nbsp;3, and it goes to a
refusal, not to another city.

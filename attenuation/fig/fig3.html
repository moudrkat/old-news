<!doctype html><meta charset="utf-8">
<title>Figure 3 — the method</title>
<style>
:root { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#6f6e6a;
  --rule:#e6e5e1; --sp:#eb6834; --ot:#9fb3c8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme=light]) {
  --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#96958c;
  --rule:#2e2e2c; --sp:#d95926; --ot:#5b6b7c; } }
body { margin:0; background:var(--surface); color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
figure { margin:20px; max-width:860px; }
svg { display:block; width:100%; height:auto; }
.h { font-size:15px; font-weight:600; fill:var(--ink); }
.sub { font-size:12px; fill:var(--muted); }
.role { font:600 11px ui-monospace,monospace; fill:var(--muted); }
.turn { font-size:13px; fill:var(--ink2); }
.hl { fill:var(--sp); font-weight:700; }
.sp { fill:var(--sp); } .ot { fill:var(--ot); }
.o0 { fill:#c7d3de; } .o2 { fill:#9fb3c8; } .o3 { fill:#7b93ab; }
.o4 { fill:#5f788f; }
.pc { font:600 10px ui-monospace,monospace; fill:#fff; }
.bl { font:600 11.5px ui-monospace,monospace; fill:var(--ink2); }
.note2 { font-size:11.5px; fill:var(--muted); }
.key { font-size:11px; fill:var(--ink2); }
.form { font:13px ui-monospace,monospace; fill:var(--ink); }
.cap { font-size:12px; fill:var(--muted); }
figcaption { margin-top:10px; color:var(--ink2); font-size:12.5px; }
</style>
<script>{const t=new URLSearchParams(location.search).get("theme");
if(t)document.documentElement.dataset.theme=t;}</script>
<figure>
<svg viewBox="0 0 860 478" role="img"
     aria-label="How the manipulation works: subtract b from the attention
     logits at one sentence's positions">
<rect width="860" height="478" fill="var(--surface)"/>

<text x="24" y="30" class="h">One value is made hard to read. Nothing is deleted.</text>
<text x="24" y="50" class="sub">The conversation is unchanged. The model simply
gives the value a fraction of the weight it would have had. The words
around it are untouched.</text>

<text x="24" y="106" class="sub">the conversation</text>
<text x="120" y="106" class="role">system</text><text x="188" y="106" class="turn">You are a helpful assistant.</text>
<text x="120" y="131" class="role">user</text><text x="188" y="131" class="turn"><tspan>By the way, my dog is called </tspan><tspan class="hl">Bagr</tspan><tspan>.</tspan></text>
<text x="120" y="156" class="role">assistant</text><text x="188" y="156" class="turn">Noted.</text>
<text x="120" y="181" class="role">user</text><text x="188" y="181" class="turn">What is my dog called?</text>

<line x1="24" y1="212" x2="836" y2="212" stroke="var(--rule)"/>
<text x="24" y="238" class="sub">what the model does</text>
<text x="188" y="238" class="form">attention logit at those positions  −  b</text>
<text x="24" y="281" class="sub">weight</text>

<rect x="188.0" y="268" width="47.0" height="17" rx="3" class="o0"/>
<text x="211.5" y="280.5" text-anchor="middle" class="pc">10%</text>
<rect x="237.0" y="268" width="159.8" height="17" rx="3" class="sp"/>
<text x="316.9" y="280.5" text-anchor="middle" class="pc">34%</text>
<rect x="398.8" y="268" width="28.2" height="17" rx="3" class="o2"/>
<text x="412.9" y="280.5" text-anchor="middle" class="pc">6%</text>
<rect x="429.0" y="268" width="141.0" height="17" rx="3" class="o3"/>
<text x="499.5" y="280.5" text-anchor="middle" class="pc">30%</text>
<rect x="572.0" y="268" width="94.0" height="17" rx="3" class="o4"/>
<text x="619.0" y="280.5" text-anchor="middle" class="pc">20%</text>
<text x="176" y="281" text-anchor="end" class="bl">b = 0</text>
<text x="678.0" y="281" class="note2">the fact: unchanged</text>
<rect x="188.0" y="314" width="69.4" height="17" rx="3" class="o0"/>
<text x="222.7" y="326.5" text-anchor="middle" class="pc">15%</text>
<rect x="259.4" y="314" width="11.8" height="17" rx="3" class="sp"/>
<rect x="273.2" y="314" width="41.7" height="17" rx="3" class="o2"/>
<text x="294.0" y="326.5" text-anchor="middle" class="pc">9%</text>
<rect x="316.8" y="314" width="208.3" height="17" rx="3" class="o3"/>
<text x="421.0" y="326.5" text-anchor="middle" class="pc">44%</text>
<rect x="527.1" y="314" width="138.9" height="17" rx="3" class="o4"/>
<text x="596.6" y="326.5" text-anchor="middle" class="pc">30%</text>
<text x="176" y="327" text-anchor="end" class="bl">b = 3</text>
<text x="678.0" y="327" class="note2">the fact: multiplied by e^-3 = 0.050</text>

<rect x="188" y="380" width="9" height="9" rx="2" class="o0"/><text x="201" y="389" class="key">system</text><rect x="324" y="380" width="9" height="9" rx="2" class="sp"/><text x="337" y="389" class="key">the value</text><rect x="460" y="380" width="9" height="9" rx="2" class="o2"/><text x="473" y="389" class="key">the rest of that turn</text><rect x="596" y="380" width="9" height="9" rx="2" class="o3"/><text x="609" y="389" class="key">the question</text>

<text x="24" y="424" class="cap">Subtracting b before the softmax multiplies
that span's weight by e^-b: 5% of it at b = 3, a quarter</text>
<text x="24" y="441" class="cap">of a percent at b = 6. The softmax renormalises, so the weight taken from the
sentence is not lost;</text>
<text x="24" y="458" class="cap">it is handed to everything else. The bars show
the share each part ends up with.</text>
</svg>
<figcaption>
<b>The sentence stays in the conversation at every setting.</b> It is not
deleted, masked out, or moved. The model still attends to it, just far less.
b = 0 is the plain causal mask, i.e. an unmodified model, so the control
condition is not a separate code path. Bars are the real arithmetic applied to
an illustrative set of starting weights.
</figcaption>
</figure>
